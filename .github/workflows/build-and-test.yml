name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  build-backend:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: ./coverage
        flags: backend
        name: backend-coverage
    
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: '**/TestResults/*.xml'

  build-frontend:
    name: Build and Test Frontend
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        app: [client, admin]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/Web/Prodaric.Web.${{ matrix.app }}/package-lock.json
    
    - name: Install dependencies
      working-directory: src/Web/Prodaric.Web.${{ matrix.app }}
      run: npm ci
    
    - name: Lint
      working-directory: src/Web/Prodaric.Web.${{ matrix.app }}
      run: npm run lint
    
    - name: Type check
      working-directory: src/Web/Prodaric.Web.${{ matrix.app }}
      run: npm run type-check
    
    - name: Test
      working-directory: src/Web/Prodaric.Web.${{ matrix.app }}
      run: npm run test:coverage
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: src/Web/Prodaric.Web.${{ matrix.app }}/coverage
        flags: frontend-${{ matrix.app }}
        name: frontend-${{ matrix.app }}-coverage
    
    - name: Build
      working-directory: src/Web/Prodaric.Web.${{ matrix.app }}
      run: npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: prodaric-web-${{ matrix.app }}
        path: src/Web/Prodaric.Web.${{ matrix.app }}/dist

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Run code analysis
      run: dotnet build --configuration Release --no-restore /p:EnforceCodeStyleInBuild=true /p:TreatWarningsAsErrors=true
    
    - name: Run security scan
      uses: securego/gosec@master
      continue-on-error: true

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build API image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/Core/Prodaric.Core.API/Dockerfile
        push: false
        tags: prodaric/api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build Web Client image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/Web/Prodaric.Web.Client/Dockerfile
        push: false
        tags: prodaric/web-client:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build Admin Panel image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/Web/Prodaric.Web.Admin/Dockerfile
        push: false
        tags: prodaric/web-admin:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
